<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5d4df">
<meta name="description" content="Una pequeña carta de cumpleaños para Zahi.">
<title>Feliz cumpleaños, Zahi</title>
<style>
:root{color-scheme:light;--ink:#6b2944;--pink:#f5d4df;--line:#bc708e}
*{box-sizing:border-box}body{margin:0;background:#f5d4df;color:var(--ink);font-family:"Times New Roman",Times,serif;font-size:18px}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.19;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%237b2445' opacity='.23' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E")}
main{width:min(100%,520px);margin:auto;padding:24px 22px 30px;min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column}
.card{position:relative;width:100%;padding:30px 22px 26px;background:#fff8f8;border:1px solid #ba7891;box-shadow:0 12px 40px #8e3c5610;text-align:center}.card:before{content:"";position:absolute;inset:7px;border:1px solid #dcb2c1;pointer-events:none}
.eyebrow{font-size:15px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 13px}
h1{font-size:clamp(31px,8vw,40px);font-weight:400;line-height:1.12;margin:0}h1 span{font-size:clamp(74px,21vw,104px);line-height:1.1;display:block;font-style:italic;margin-top:3px;letter-spacing:-.06em;padding-right:.06em}
.bouquet{width:245px;max-width:90%;height:240px;display:block;margin:0 auto 3px;overflow:visible}
.message{max-width:290px;margin:0 auto;font-size:19px;line-height:1.5}.closing{font-size:17px;font-style:italic;margin:18px 0 0}
.music{width:100%;padding:23px 0 0;text-align:center}.music p{font-size:16px;font-style:italic;margin:0 0 13px}.artists{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.artists a{color:var(--ink);text-decoration:none;border:1px solid #bb7892;border-radius:30px;padding:11px 14px;font-size:15px;background:#f9e5ec;transition:background .2s,transform .2s}.artists a:hover{background:#fff8f8;transform:translateY(-2px)}a:focus-visible{outline:2px solid #6b2944;outline-offset:4px}
.flower{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate}.flower.second{animation-delay:-2s}.flower.third{animation-delay:-4s}@keyframes sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}@media(prefers-reduced-motion:reduce){.flower{animation:none}.artists a{transition:none}}@media(max-width:350px){main{padding:16px}.card{padding-inline:17px}.artists{gap:6px}.artists a{padding:10px 11px}}
</style>
<style>
.background-music{position:fixed;right:16px;bottom:16px;z-index:2;font:16px "Times New Roman",Times,serif;color:var(--ink);background:#fff8f8;border:1px solid #bb7892;border-radius:24px;padding:11px 16px;min-height:44px;cursor:pointer;box-shadow:0 3px 14px #6b294418}
.background-music:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
main{padding-bottom:78px}
</style>
</head>
<body>
<audio id="background-song" src="./song.mp3" autoplay loop playsinline preload="auto"></audio>
<button id="music-toggle" class="background-music" type="button" aria-controls="background-song" aria-pressed="false">Activar música</button>
<main>
<article class="card" aria-label="Carta de cumpleaños para Zahi">
<p class="eyebrow">Hoy es tu día</p>
<h1>Feliz cumpleaños,<span>Zahi</span></h1>
<svg class="bouquet" viewBox="0 0 280 270" role="img" aria-labelledby="flowers-title">
<title id="flowers-title">Un pequeño ramo de flores rosas para ti</title>
<defs>
<g id="bloom">
<path d="M0 0C-35-7-44-39-25-45C-11-50-1-30 0-20C2-42 23-54 34-39C46-22 18-5 0 0Z" fill="#e8a3b9" stroke="#a95175" stroke-width="1"/>
<path d="M0 0C-23 8-44-9-34-24C-25-37-8-18 0-10C10-29 34-30 37-13C40 5 15 9 0 0Z" fill="#f3bacb" stroke="#a95175" stroke-width="1"/>
<path d="M0 0C-15-5-19-19-9-24C1-29 15-18 14-10C13-3 6 2 0 0Z" fill="#ca7394" stroke="#a95175" stroke-width="1"/>
<path d="M-8-8Q0-20 9-10M-4-3Q3-9 7-5" fill="none" stroke="#994663" stroke-width="1"/>
</g>
<g id="daisy">
<g fill="#fff2f5" stroke="#bc8096" stroke-width=".8">
<ellipse cy="-16" rx="7" ry="16"/><ellipse cy="-16" rx="7" ry="16" transform="rotate(45)"/><ellipse cy="-16" rx="7" ry="16" transform="rotate(90)"/><ellipse cy="-16" rx="7" ry="16" transform="rotate(135)"/><ellipse cy="-16" rx="7" ry="16" transform="rotate(180)"/><ellipse cy="-16" rx="7" ry="16" transform="rotate(225)"/><ellipse cy="-16" rx="7" ry="16" transform="rotate(270)"/><ellipse cy="-16" rx="7" ry="16" transform="rotate(315)"/>
</g><circle r="7" fill="#c99462"/><circle r="3" fill="#a67448"/>
</g>
</defs>
<g fill="none" stroke="#798b65" stroke-width="2" stroke-linecap="round">
<path d="M144 239Q105 163 70 105M144 239Q146 145 148 74M144 239Q179 147 211 110M144 239Q104 169 101 149M144 239Q176 195 201 168"/>
</g>
<g fill="#96a078" stroke="#71825d" stroke-width="1">
<path d="M128 207Q85 197 86 164Q118 167 128 207Z"/><path d="M150 200Q151 164 181 153Q186 183 150 200Z"/><path d="M137 157Q112 153 113 130Q137 130 137 157Z"/><path d="M167 183Q193 178 207 192Q185 204 167 183Z"/><path d="M97 151Q70 153 67 131Q87 128 97 151Z"/>
</g>
<g class="flower"><use href="#bloom" transform="translate(72 109) rotate(-28) scale(1.12)"/></g>
<g class="flower second"><use href="#bloom" transform="translate(149 78) rotate(12) scale(1.22)"/></g>
<g class="flower third"><use href="#bloom" transform="translate(210 117) rotate(30) scale(.95)"/></g>
<use href="#daisy" transform="translate(102 147) rotate(-12) scale(.67)"/>
<use href="#daisy" transform="translate(201 167) rotate(15) scale(.6)"/>
<g fill="none" stroke="#ae6281" stroke-width="1.5"><path d="M139 223C111 204 99 229 139 228C175 202 186 232 143 228M140 228Q126 240 116 247M143 228Q158 243 163 250"/></g>
</svg>
<p class="message">Que tengas un día muy bonito, lleno de amor y momentos felices. Te deseo lo mejor hoy y siempre.</p>
<p class="closing">Con mucho cariño, para ti.</p>
</article>
<footer class="music">
<p>Y que hoy suene lo que más te gusta.</p>
<nav class="artists" aria-label="Escucha a tus artistas favoritos en Spotify">
<a href="https://open.spotify.com/search/Humbe" target="_blank" rel="noopener noreferrer" aria-label="Escuchar Humbe en Spotify (abre otra pestaña)">Humbe</a>
<a href="https://open.spotify.com/search/Latin%20Mafia" target="_blank" rel="noopener noreferrer" aria-label="Escuchar Latin Mafia en Spotify (abre otra pestaña)">Latin Mafia</a>
<a href="https://open.spotify.com/search/Fuerza%20Regida" target="_blank" rel="noopener noreferrer" aria-label="Escuchar Fuerza Regida en Spotify (abre otra pestaña)">Fuerza Regida</a>
</nav>
</footer>
</main>
<script>
const song = document.getElementById('background-song');
const toggle = document.getElementById('music-toggle');
song.volume = 0.6;
function updateMusicButton() {
  const playing = !song.paused && !song.ended;
  toggle.textContent = playing ? 'Pausar música' : 'Activar música';
  toggle.setAttribute('aria-pressed', String(playing));
}
async function startMusic() {
  try {
    await song.play();
  } catch {
    updateMusicButton();
  }
}
toggle.addEventListener('click', () => {
  if (song.paused) {
    if (song.error) song.load();
    startMusic();
  } else {
    song.pause();
  }
});
song.addEventListener('play', updateMusicButton);
song.addEventListener('pause', updateMusicButton);
song.addEventListener('error', () => {
  toggle.hidden = true;
});
song.addEventListener('canplay', () => { toggle.hidden = false; });
startMusic();
</script>
</body>
</html>
